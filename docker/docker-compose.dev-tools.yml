services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sn_kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://localhost:9092
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    networks:
      - sn-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sn_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8091:8081"
    depends_on:
      - redis
    networks:
      - sn-network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sn_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - sn-network

volumes:
  pgadmin_data:

networks:
  sn-network:
    name: social-network_sn-network

