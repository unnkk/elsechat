spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update  # !!! WIP BUILD ONLY !!! ONLY "VALIDATE" FOR DEPLOY
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
  servlet:
    context-path: /

app:
  jwt:
    secret: "this-is-a-very-long-secret-key-for-hs256-algorithm-minimum-32-characters-required!"
    expiration: 86400000  # (24 hours * 60 minutes * 60 seconds * 1000 milliseconds)
    refresh-expiration: 604800000  # 7 days

logging:
  level:
    root: INFO
    com.elsechat.auth: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always