spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/**

            - id: post-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/posts/**
  main:
    web-application-type: reactive

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway
app:
  jwt:
    secret: "this-is-a-very-long-secret-key-for-hs256-algorithm-minimum-32-characters-required!"
    expiration: 86400000  # (24 hours * 60 minutes * 60 seconds * 1000 milliseconds)
    refresh-expiration: 604800000  # 7 days